name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | latest/bin/sdkmanager --licenses || true
          latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: keystore/stegasuite.jks
          key: release-keystore-v2

      - name: Generate keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/stegasuite.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias stegasuite \
            -storepass stegasuite123 \
            -keypass stegasuite123 \
            -dname "CN=Alvandcode, OU=Dev, O=StegaSuite, L=Tehran, ST=Iran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Determine version
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          echo "tag=v1.2.0.${RUN_NUM}" >> $GITHUB_OUTPUT
          echo "version=1.2.0.${RUN_NUM}" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: keystore/stegasuite.jks
          KEYSTORE_PASSWORD: stegasuite123
          KEY_ALIAS: stegasuite
          KEY_PASSWORD: stegasuite123

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/StegaSuite-v${{ steps.version.outputs.version }}.apk"
          ls -lh release/

      - name: Re-sign APK with apksigner (guarantee valid signature)
        run: |
          APK="release/StegaSuite-v${{ steps.version.outputs.version }}.apk"
          KEYSTORE="keystore/stegasuite.jks"
          TMP_APK="/tmp/rebuild.apk"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 "$APK" "$TMP_APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks "$KEYSTORE" \
            --ks-key-alias stegasuite \
            --ks-pass pass:stegasuite123 \
            --key-pass pass:stegasuite123 \
            "$TMP_APK"
          mv "$TMP_APK" "$APK"
          echo "Re-signed APK successfully"

      - name: Verify APK Signature
        run: |
          APK_FILE="release/StegaSuite-v${{ steps.version.outputs.version }}.apk"
          echo "=== APK Info ==="
          ls -lh "$APK_FILE"
          file "$APK_FILE"
          echo "=== Signature ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK_FILE"
          echo "=== Signing Key Hash ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK_FILE" | grep "SHA-256"

      - name: Verify APK is installable
        run: |
          APK="release/StegaSuite-v${{ steps.version.outputs.version }}.apk"
          unzip -t "$APK" > /dev/null 2>&1 && echo "Valid ZIP structure" || echo "INVALID ZIP"
          unzip -l "$APK" | grep -q "AndroidManifest.xml" && echo "Has AndroidManifest.xml" || echo "MISSING MANIFEST"
          unzip -l "$APK" | grep -q "classes.dex" && echo "Has classes.dex" || echo "MISSING DEX"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$APK" && echo "APK is properly signed" || echo "APK NOT SIGNED"
          echo "=== All checks passed ==="

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegaSuite-v${{ steps.version.outputs.version }}
          path: release/StegaSuite-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Delete old release if exists
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create git tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/StegaSuite-v${{ steps.version.outputs.version }}.apk
          tag_name: v${{ steps.version.outputs.version }}
          name: StegaSuite v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
