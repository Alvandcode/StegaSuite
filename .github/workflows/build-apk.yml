name: Build Android APK
on:
  push: { branches: ["**"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: |
          if [ ! -f "./gradlew" ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x ./gradlew
      - run: ./gradlew --no-daemon assembleDebug --stacktrace
      - run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: StegaSuite-v1.1.${{ github.run_number }}
          path: app/build/outputs/apk/debug/StegaSuite-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/StegaSuite-*.apk
          tag_name: v1.1.${{ github.run_number }}
          name: StegaSuite v1.1.${{ github.run_number }}
          generate_release_notes: true
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
