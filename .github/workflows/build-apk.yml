name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | latest/bin/sdkmanager --licenses || true
          latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: keystore/stegasuite.jks
          key: release-keystore-v2

      - name: Generate keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/stegasuite.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias stegasuite \
            -storepass stegasuite123 \
            -keypass stegasuite123 \
            -dname "CN=Alvandcode, OU=Dev, O=StegaSuite, L=Tehran, ST=Iran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "version=v1.1.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: keystore/stegasuite.jks
          KEYSTORE_PASSWORD: stegasuite123
          KEY_ALIAS: stegasuite
          KEY_PASSWORD: stegasuite123

      - name: List APK
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegaSuite-${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/release/StegaSuite-*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/StegaSuite-*.apk
          tag_name: ${{ steps.version.outputs.tag }}
          name: StegaSuite ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
